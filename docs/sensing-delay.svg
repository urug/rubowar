<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#1a1a2e"/>

  <!-- Timeline -->
  <line x1="50" y1="280" x2="650" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="660" y="285" fill="#888" font-family="monospace" font-size="12">time</text>

  <!-- Chronon markers -->
  <line x1="150" y1="275" x2="150" y2="285" stroke="#666" stroke-width="2"/>
  <text x="150" y="305" fill="#fff" font-family="monospace" font-size="14" text-anchor="middle">Chronon N</text>

  <line x1="400" y1="275" x2="400" y2="285" stroke="#666" stroke-width="2"/>
  <text x="400" y="305" fill="#fff" font-family="monospace" font-size="14" text-anchor="middle">Chronon N+1</text>

  <!-- Rubot A (sender) -->
  <circle cx="100" cy="150" r="25" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="155" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">A</text>
  <text x="100" y="195" fill="#60a5fa" font-family="monospace" font-size="11" text-anchor="middle">pulse()</text>

  <!-- Rubot B (detected) -->
  <circle cx="300" cy="150" r="25" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
  <text x="300" y="155" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">B</text>

  <!-- Pulse wave rings (expanding from A) -->
  <circle cx="100" cy="150" r="45" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7">
    <animate attributeName="r" from="30" to="80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="150" r="65" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" from="30" to="80" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.8" to="0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse reaches B indicator -->
  <path d="M 130 150 Q 200 100 270 150" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="200" y="95" fill="#60a5fa" font-family="monospace" font-size="10" text-anchor="middle">pulse detects B</text>

  <!-- Timeline events -->
  <!-- Event 1: pulse() called -->
  <circle cx="150" cy="250" r="6" fill="#3b82f6"/>
  <line x1="150" y1="256" x2="150" y2="275" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="150" y="240" fill="#60a5fa" font-family="monospace" font-size="9" text-anchor="middle">A calls</text>
  <text x="150" y="228" fill="#60a5fa" font-family="monospace" font-size="9" text-anchor="middle">pulse()</text>

  <!-- Event 2: Sense phase executes -->
  <circle cx="240" cy="250" r="6" fill="#8b5cf6"/>
  <line x1="240" y1="256" x2="240" y2="275" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="240" y="240" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">sense</text>
  <text x="240" y="228" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">phase</text>

  <!-- Event 3: Result stored -->
  <circle cx="330" cy="250" r="6" fill="#10b981"/>
  <line x1="330" y1="256" x2="330" y2="275" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="330" y="240" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">result</text>
  <text x="330" y="228" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">stored</text>

  <!-- Rubot A at N+1 (receiving result) -->
  <circle cx="450" cy="150" r="25" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="450" y="155" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">A</text>

  <!-- Result available indicator -->
  <rect x="410" y="185" width="80" height="24" rx="4" fill="#10b981" opacity="0.2" stroke="#10b981"/>
  <text x="450" y="202" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">pulse_echo</text>

  <!-- Event 4: Result available -->
  <circle cx="450" cy="250" r="6" fill="#10b981"/>
  <line x1="450" y1="256" x2="450" y2="275" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="240" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">A reads</text>
  <text x="450" y="228" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">result</text>

  <!-- Data flow arrow -->
  <path d="M 340 250 C 370 220 420 220 445 245" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Result content box -->
  <rect x="500" y="120" width="170" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="515" y="142" fill="#94a3b8" font-family="monospace" font-size="11">pulse_echo:</text>
  <text x="515" y="160" fill="#10b981" font-family="monospace" font-size="10">[{ x: 300, y: 150,</text>
  <text x="525" y="175" fill="#10b981" font-family="monospace" font-size="10">type: :rubot }]</text>

  <!-- Arrow from A to result box -->
  <path d="M 475 165 L 495 165" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Title -->
  <text x="350" y="30" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sensing Delay: Results Available Next Chronon</text>

  <!-- Legend -->
  <rect x="50" y="35" width="12" height="12" fill="#3b82f6"/>
  <text x="68" y="45" fill="#888" font-family="monospace" font-size="10">action queued</text>

  <rect x="160" y="35" width="12" height="12" fill="#8b5cf6"/>
  <text x="178" y="45" fill="#888" font-family="monospace" font-size="10">phase executes</text>

  <rect x="280" y="35" width="12" height="12" fill="#10b981"/>
  <text x="298" y="45" fill="#888" font-family="monospace" font-size="10">result available</text>
</svg>
