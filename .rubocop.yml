AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "rubots/**/*"

# Allow variable names like value_at_100 in tests
Naming/VariableNumber:
  Exclude:
    - "test/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Metrics/AbcSize:
  Max: 25
  Exclude:
    - "lib/rubowar/arena.rb"
    - "lib/rubowar/renderers/**/*"

Naming/MethodParameterName:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - "lib/rubowar/arena.rb"
    - "lib/rubowar/battle.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/rubowar/arena.rb"
    - "lib/rubowar/battle.rb"

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "lib/rubowar/arena.rb"

Metrics/ModuleLength:
  Max: 220

Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 160

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "bin/simulate"
